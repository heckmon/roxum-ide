name: Build and Release Roxum IDE

on:
  push:
    tags:
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Configure Android
        shell: bash
        run: |
          set -e

          FLUTTER_BIN="$(readlink -f "$(command -v flutter)")"
          FLUTTER_ROOT="$(dirname "$(dirname "$FLUTTER_BIN")")"
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"

          VERSION="$(python3 - <<'PY'
          import re
          from pathlib import Path

          content = Path("pubspec.yaml").read_text()
          match = re.search(
              r"(?m)^version:\s*[\"']?([^\"'\s#]+)",
              content
          )

          if not match:
              raise SystemExit("Could not find version in pubspec.yaml")

          print(match.group(1))
          PY
          )"

          VERSION_NAME="${VERSION%%+*}"

          if [[ "$VERSION" == *"+"* ]]; then
            VERSION_CODE="${VERSION##*+}"
          else
            VERSION_CODE=1
          fi

          mkdir -p android

          cat > android/local.properties <<EOF
          sdk.dir=$SDK_DIR
          flutter.sdk=$FLUTTER_ROOT
          flutter.buildMode=release
          flutter.versionName=$VERSION_NAME
          flutter.versionCode=$VERSION_CODE
          EOF

          echo "Flutter SDK: $FLUTTER_ROOT"
          echo "Android SDK: $SDK_DIR"
          echo "Version: $VERSION_NAME ($VERSION_CODE)"

      - name: Flutter Pub Get
        run: flutter pub get

      - name: Configure Release Signing
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"

          echo "$SIGNING_KEY" | base64 -d > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          cat > android/key.properties <<EOF
          storePassword=$KEY_STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=$KEYSTORE_PATH
          EOF

          echo "Release signing configured."

      - name: Build Release AAB
        run: |
          set -e

          chmod +x android/gradlew

          cd android
          ./gradlew :app:bundleRelease

      - name: Download Bundletool
        run: |
          set -e

          URL=$(curl -fsSL \
            https://api.github.com/repos/google/bundletool/releases/latest \
            | jq -r '.assets[] |
              select(.name | test("^bundletool-all-.*\\.jar$")) |
              .browser_download_url' | head -n 1)

          test -n "$URL"
          test "$URL" != "null"

          curl -fL "$URL" -o bundletool.jar

      - name: Build Universal APK
        env:
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -e

          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          SIGNED_AAB="build/app/outputs/bundle/release/app-release.aab"

          printf '%s' "$KEY_STORE_PASSWORD" > "$RUNNER_TEMP/ks-pass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/key-pass"

          test -f "$SIGNED_AAB"
          test -f "$KEYSTORE_PATH"

          java -jar bundletool.jar build-apks \
            --bundle="$SIGNED_AAB" \
            --output=output.apks \
            --mode=universal \
            --ks="$KEYSTORE_PATH" \
            --ks-pass=file:"$RUNNER_TEMP/ks-pass" \
            --ks-key-alias="$KEY_ALIAS" \
            --key-pass=file:"$RUNNER_TEMP/key-pass" \
            --overwrite

          unzip -p output.apks universal.apk > roxum-full.apk

          test -s roxum-full.apk

          APKSIGNER="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)/apksigner"

          "$APKSIGNER" verify --verbose roxum-full.apk

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.roxum
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          tracks: internal,alpha,production
          releaseName: Roxum v${{ github.ref_name }}
          status: completed

          whatsNewDirectory: distribution/whatsnew

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Roxum v${{ github.ref_name }}
          body: |
              - Enhanced code execution
              - Roxum's built-in Markdown engine has been migrated to GitHub-Flavored Markdown (GFM).
              - Fixed file opening bugs.
          generate_release_notes: false
          draft: false
          files: |
            build/app/outputs/bundle/release/app-release.aab
            roxum-full.apk